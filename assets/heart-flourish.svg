<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2BF6F" />
      <stop offset="25%" stop-color="#C9A048" />
      <stop offset="55%" stop-color="#F2DD9E" />
      <stop offset="85%" stop-color="#B88A35" />
      <stop offset="100%" stop-color="#8F6423" />
    </linearGradient>
    <linearGradient id="goldStrokeGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#9E762E" stop-opacity="0.3" />
      <stop offset="15%" stop-color="#C9A048" />
      <stop offset="50%" stop-color="#EBD391" />
      <stop offset="85%" stop-color="#C9A048" />
      <stop offset="100%" stop-color="#9E762E" stop-opacity="0.3" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="rgba(124, 88, 26, 0.22)" />
    </filter>
  </defs>

  <g filter="url(#goldGlow)">
    <!-- Central Heart -->
    <path d="M 160 52 
             C 160 52 138 36 132 26 
             C 125 14 135 4 147 8 
             C 154 11 158 17 160 21 
             C 162 17 166 11 173 8 
             C 185 4 195 14 188 26 
             C 182 36 160 52 160 52 Z" 
          fill="url(#goldGradient)" />

    <!-- Left Upper Main Curved Flourish Line -->
    <path d="M 130 34 
             C 106 37 78 40 52 31 
             C 36 25 24 17 28 11 
             C 31 7 40 10 38 17 
             C 36 23 27 24 22 21" 
          fill="none" 
          stroke="url(#goldGradient)" 
          stroke-width="2.2" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Left Lower Accent Curved Line -->
    <path d="M 133 42 
             C 118 48 107 55 105 63 
             C 103 69 111 72 115 66 
             C 118 61 112 54 101 50" 
          fill="none" 
          stroke="url(#goldGradient)" 
          stroke-width="1.8" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Right Upper Main Curved Flourish Line -->
    <path d="M 190 34 
             C 214 37 242 40 268 31 
             C 284 25 296 17 292 11 
             C 289 7 280 10 282 17 
             C 284 23 293 24 298 21" 
          fill="none" 
          stroke="url(#goldGradient)" 
          stroke-width="2.2" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Right Lower Accent Curved Line -->
    <path d="M 187 42 
             C 202 48 213 55 215 63 
             C 217 69 209 72 205 66 
             C 202 61 208 54 219 50" 
          fill="none" 
          stroke="url(#goldGradient)" 
          stroke-width="1.8" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Bottom Center Fleur Droplet Accent -->
    <circle cx="160" cy="59" r="2.2" fill="url(#goldGradient)" />
    <path d="M 160 62.5 L 160 68" stroke="url(#goldGradient)" stroke-width="1.6" stroke-linecap="round" />
  </g>
</svg>